# MRI pipeline configuration
#
# The user provides the actual input and output roots from the CLI:
#
#   python run_pipeline.py run --input "..." --output "..." --steps ...
#
# All folders below are relative to the selected --output folder.

run:
  default_steps:
    - split-sequences
    - preprocess-flair
    - split-normalizations

  folders:
    patients: "Patients"
    split_sequences: "By_Sequence"
    preprocessed_flair: "Preprocessed_FLAIR"
    difference_images: "Difference_Images"
    organized_pre: "Organized_Pre"
    organized_post: "Organized_Post"
    transforms: "Transforms"

  timepoints:
    pre: "Pre"
    post: "Post"

  sequences:
    - FLAIR
    - dDTI
    - faDTI
    - isoDTI

  normalizations:
    - z-score
    - min-max
    - fcm
    - whitestripe

  transforms:
    save: true
    overwrite: false
    pre_folder: "Pre_Transformations"
    post_folder: "Post_Transformations"

  preprocess_flair:
    atlas_path: "/path/to/reference_or_atlas_FLAIR.nii.gz"
    sequence: "FLAIR"
    steps:
      - n4
      - registration
      - skull-strip
      - normalization
    normalization_methods:
      - z-score
      - min-max
      - fcm
      - whitestripe

  difference_images:
    source_timepoint: "Post"
    reference_timepoint: "Pre"
    image_pattern: "*_R.nii*"
    output_suffix: "_diff"
    histogram_levels: 512
    match_points: 10
    threshold_at_mean: true

  flames:
    root: "/path/to/FLAMeS"
    dataset_id: "004"
    configuration: "3d_fullres"
    trainer: "nnUNetTrainer_8000epochs"

  synthseg:
    python_executable: "/path/to/synthseg/python"
    script_path: "/path/to/SynthSeg_predict.py"
    keepgeom: false
    version: "auto"
    keep_intermediate: false
